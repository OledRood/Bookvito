services:
  postgres-test:
    image: postgres:15-alpine
    container_name: bookvito_postgres_test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bookvito_test
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bookvito_test"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-test:
    image: minio/minio:RELEASE.2025-02-03T21-03-04Z
    container_name: bookvito_minio_test
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "19000:9000"
      - "19001:9001"
